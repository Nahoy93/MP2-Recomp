# N64Recomp configuration for Mario Party 2 (USA).
#
# Paths are relative to this file. Everything under ../generated is produced
# from your own ROM by tools/gen_syms.py and is never committed.

[input]
entrypoint = 0x80000400
symbols_file_path = "../generated/mp2.us.syms.toml"
rom_file_path = "../generated/baserom.z64"
output_func_path = "../generated/RecompiledFuncs"

# Group functions into larger files: about 30 000 single-function files take a
# long time to compile on Windows.
functions_per_output_file = 64

# Every generated file starts with this. mp2_recomp_decls.h declares the
# functions N64Recomp calls but does not emit (the ones listed under "ignored"
# below, and libultra functions the runtime provides). It is generated by
# tools/gen_decls.py after N64Recomp has run.
recomp_include = """#include "recomp.h"
#include "mp2_recomp_decls.h""""

[patches]

stubs = [
]

# Functions replaced by native code in recomp/src. N64Recomp does not translate
# these; calls to them go to the C++ implementation of the same name.
ignored = [
    # Overlay loader DMA (src/rom.c in the decomp). The game copies each
    # minigame/board overlay to 0x80102800 in 0x4000-byte pieces, which the
    # runtime's overlay tracking cannot see as one load. src/overlays.cpp does
    # the copy in one piece and tells the runtime which overlay is now loaded.
    "HuRomDmaCodeRead",

    # 64-bit division helpers. N64Recomp renames these to <name>_recomp and
    # still translates them, but librecomp already defines the same names
    # (src/math_routines.cpp). Two definitions fail the Windows link, so the
    # game's copies are skipped and the runtime's are used.
    "__divdi3_recomp",
    "__udivdi3_recomp",
    "__umoddi3_recomp",
    # Same for setjmp/longjmp (librecomp/src/recomp.cpp).
    "setjmp_recomp",
    "longjmp_recomp",
]
